<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>綁定候診通知</title>
<style>
  :root{ --g:#1f7a5a; --bg:#f5f7f6; --line:#dfe5e2; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:"Noto Sans TC",system-ui,sans-serif; background:var(--bg); color:#222; }
  .wrap{ max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1{ font-size:20px; text-align:center; color:var(--g); margin:8px 0 4px; }
  .sub{ text-align:center; color:#667; font-size:13px; margin-bottom:10px; }
  .notice{ color:#c0392b; font-size:13px; line-height:1.85; text-align:center; margin:0 4px 16px; }
  .stitle{ text-align:center; font-size:18px; font-weight:700; color:var(--g); margin:2px 0 14px; }
  .scard{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .sname{ font-size:16px; font-weight:700; }
  .sclinic{ color:var(--g); font-size:14px; }
  .snum{ font-size:15px; margin-top:8px; } .snum b{ color:var(--g); font-size:24px; }
  .srooms{ font-size:14px; color:#445; margin-top:6px; }
  .sahead{ font-size:15px; margin-top:8px; } .sahead b{ color:#e8622a; font-size:22px; }
  .hot{ color:#c0392b; font-weight:700; }
  .srefresh{ text-align:center; color:#8a94a0; font-size:12px; margin:4px 0 14px; }
  .linkbtn{ width:100%; font-size:15px; font-weight:600; color:var(--g); background:#fff; border:1px solid var(--g); border-radius:12px; padding:12px; cursor:pointer; font-family:inherit; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label{ display:block; font-size:14px; font-weight:600; margin:0 0 8px; }
  .rooms{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .room{ border:2px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; cursor:pointer; background:#fff; }
  .room.sel{ border-color:var(--g); background:#eef6f2; }
  .room .r{ font-size:16px; font-weight:700; }
  .room .d{ font-size:13px; color:#556; margin-top:2px; }
  .room .c{ font-size:12px; color:#8a94a0; margin-top:4px; }
  input[type=number]{ width:100%; font-size:22px; text-align:center; padding:12px; border:2px solid var(--line); border-radius:12px; }
  .fld{ width:100%; font-size:17px; padding:11px 12px; border:2px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .flab{ font-size:13px; color:#667; font-weight:600; margin:2px 0 4px; }
  .consent{ display:flex; align-items:flex-start; gap:8px; font-size:14px; font-weight:500; color:#445; margin:0 2px 12px; line-height:1.5; }
  .consent input{ margin-top:3px; transform:scale(1.25); }
  .agree{ background:#fff; border:1px solid var(--line); border-radius:12px; margin:0 2px 12px; overflow:hidden; }
  .agree summary{ cursor:pointer; list-style:none; padding:13px 14px; font-size:14px; font-weight:600; color:var(--g); }
  .agree summary::-webkit-details-marker{ display:none; }
  .agree summary::after{ content:'▼ 展開'; float:right; font-size:12px; font-weight:500; color:#8aa; }
  .agree[open] summary::after{ content:'▲ 收合'; }
  .agreebody{ padding:2px 15px 15px; font-size:12.5px; color:#445; line-height:1.85; }
  .agreebody b{ color:#2c3a34; }
  button.go{ width:100%; font-size:18px; font-weight:700; color:#fff; background:var(--g); border:0; border-radius:12px; padding:15px; margin-top:6px; }
  button.go:disabled{ background:#9bb8ac; }
  .msg{ text-align:center; font-size:14px; padding:14px; }
  .ok{ color:var(--g); }
  .err{ color:#c0392b; }
  .clinic{ text-align:center; font-weight:700; color:var(--g); margin-bottom:10px; }
  .info{ font-size:15px; color:#445; line-height:1.9; }
  .clist{ display:grid; gap:10px; }
  .cbtn{ border:2px solid var(--line); border-radius:12px; padding:14px; background:#fff; text-align:left; font-size:16px; font-weight:600; cursor:pointer; }
  .cbtn:disabled{ color:#aab; background:#f3f5f4; cursor:default; }
  .cbtn .tag{ float:right; font-size:12px; font-weight:500; color:var(--g); }
  .back{ background:none; border:0; color:var(--g); font-size:14px; padding:2px 0 8px; cursor:pointer; }
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">
  <h1>候診進度通知綁定</h1>
  <div class="sub">綁定後，看診當天報到即自動推播看診號碼與候診進度</div>
  <div class="notice">※ 每人只需綁定一次<br>※ 一支手機可綁定多名家庭成員，候診推播以綁定手機通知為主<br>※ 綁定後，看診日仍需至櫃檯報到</div>
  <div id="app"><div class="msg">載入中…</div></div>
</div>

<script>
// ===== 設定 =====
var LIFF_ID = '2010248499-DkRGVJOi';
var API = 'https://script.google.com/macros/s/AKfycbyYmXOinG3AMnVQbVGdzR9AKqg-KUC7P_ofpjZfI2n7584Iu-v6GV1s5pW3bvblJ4nHLA/exec';

// 可選：院區 QR 帶入 ?c=院區代碼&n=院區名（有帶就鎖定，沒帶就讓病人自己選）
var qp = new URLSearchParams(location.search);
var CLINIC = (qp.get('c')||'').trim();
var CNAME  = (qp.get('n')||'').trim();
var FROM_QR = !!CLINIC;
var USER = { id:'', name:'' };
var pick = { room:'', doctor:'' };

function el(id){ return document.getElementById(id); }
function get(url){ return fetch(url).then(function(r){ return r.json(); }); }

// ===== 候診進度（自助查看，每 10 秒刷新）=====
var statusTimer = null;
function stopStatusTimer(){ if (statusTimer){ clearInterval(statusTimer); statusTimer = null; } }
function loadStatus(){
  get(API + '?action=mystatus&userId=' + encodeURIComponent(USER.id)).then(function(res){
    if (res && res.ok && res.list && res.list.length) renderStatus(res.list);
    else if (res && res.ok && res.bound) renderBound();
    else { stopStatusTimer(); render(); }
  }).catch(function(){ stopStatusTimer(); render(); });
}
function renderBound(){
  stopStatusTimer();
  el('app').innerHTML = '<div class="msg ok">您已完成綁定 ✅<br><br>看診當天於櫃檯完成報到後，即可在此查看即時候診進度。</div>'
    + '<button class="linkbtn" onclick="render()">綁定其他人 / 重新綁定</button>';
}
function renderStatus(list){
  var h = '<div class="stitle">候診進度</div>';
  list.forEach(function(it){
    var maxc = -1; (it.rooms||[]).forEach(function(rm){ if (rm.current > maxc) maxc = rm.current; });
    var roomsTxt = (it.rooms && it.rooms.length)
      ? it.rooms.map(function(rm){ return rm.room+' '+rm.current+' 號'; }).join('、') : '尚未開診';
    var ahead;
    if (maxc < 0) ahead = '<span class="hot">尚未開診</span>';
    else if (it.number - maxc <= 0) ahead = '<span class="hot">已輪到／已過號，請至櫃檯確認</span>';
    else ahead = '前面還有約 <b>'+(it.number - maxc)+'</b> 號';
    h += '<div class="scard">'
      + '<div class="sname">'+(it.name||'')+'　<span class="sclinic">'+it.clinic+'</span></div>'
      + '<div class="snum">您的號碼 <b>'+it.number+'</b></div>'
      + '<div class="srooms">現在 '+roomsTxt+'</div>'
      + '<div class="sahead">'+ahead+'</div>'
      + '</div>';
  });
  h += '<div class="srefresh">畫面每 10 秒自動更新</div>';
  h += '<button class="linkbtn" onclick="stopStatusTimer(); render();">綁定其他人 / 重新綁定</button>';
  el('app').innerHTML = h;
  if (!statusTimer) statusTimer = setInterval(loadStatus, 10000);
}

function infoText(rooms){
  if (!rooms || !rooms.length) return '目前暫無看診資料';
  return '目前看診進度<br>' + rooms.map(function(rm){
    return '・'+rm.room+'　'+(rm.doctor||'')+'　目前 '+(isNaN(rm.current)?'-':rm.current)+' 號';
  }).join('<br>');
}

function render(){
  var h = '';
  h += '<div class="card"><label>綁定資料</label>'+
       '<div class="flab">姓名</div><input type="text" id="rn" class="fld" placeholder="請輸入姓名">'+
       '<div class="flab">身分證字號</div><input type="text" id="pid" class="fld" maxlength="10" autocapitalize="characters" placeholder="例 A123456789">'+
       '</div>';
  h += '<details class="agree"><summary>個人資料蒐集、處理及利用告知暨同意書</summary>'
     + '<div class="agreebody">'
     + '金鶯診所（金鶯健康股份有限公司，以下稱本院）為提供 LINE 候診通知與報到自動帶號服務，依《個人資料保護法》第 8 條規定，向您告知並徵求同意如下：<br><br>'
     + '<b>一、蒐集目的：</b>候診叫號通知、看診報到號碼推播、就醫聯繫及醫療服務品質提升。<br>'
     + '<b>二、蒐集之個人資料類別：</b>姓名、身分證字號，及您的 LINE 帳號識別碼（user ID）。<br>'
     + '<b>三、利用之期間、地區、對象及方式：</b><br>'
     + '　・期間：自您同意之日起，至您停止使用本服務或本院停止提供本服務之日止。<br>'
     + '　・地區：中華民國境內（資料儲存於本院所使用之雲端服務）。<br>'
     + '　・對象：本院及受本院委託處理之資訊服務提供者。<br>'
     + '　・方式：於前述目的範圍內，以自動化或非自動化方式蒐集、處理及利用。<br>'
     + '<b>四、當事人權利：</b>您得依個資法第 3 條，向本院請求查詢、閱覽、製給複製本、補充或更正，並得請求停止蒐集、處理、利用或請求刪除您的個人資料。<br>'
     + '<b>五、不提供之影響：</b>您可自由選擇是否提供個人資料；若不提供，將無法使用本 LINE 候診通知及報到帶號服務，但不影響您於本院之一般就醫權益。<br>'
     + '<b>六、</b>本院僅於前述目的範圍內使用您的資料，不會用於行銷或提供予與前述目的無關之第三方。'
     + '</div></details>';
  h += '<label class="consent"><input type="checkbox" id="cs"> 我已詳閱並同意上述《個人資料蒐集、處理及利用告知暨同意書》。</label>';
  h += '<button class="go" id="go" disabled>完成綁定</button>';
  h += '<div class="msg" id="tip"></div>';
  el('app').innerHTML = h;
  ['rn','pid'].forEach(function(id){ el(id).addEventListener('input', check); });
  el('pid').addEventListener('input', function(){ this.value = this.value.toUpperCase(); });
  el('cs').addEventListener('change', check);
  el('go').onclick = submit;
}

function check(){
  var ok = el('rn').value.trim()
        && /^[A-Z][0-9]{9}$/.test(el('pid').value.trim())
        && el('cs').checked;
  el('go').disabled = !ok;
}

function submit(){
  var rn = el('rn').value.trim();
  el('go').disabled = true;
  el('tip').innerHTML = '送出中…';
  var u = API + '?action=bind'
    + '&userId='    + encodeURIComponent(USER.id)
    + '&name='      + encodeURIComponent(USER.name)
    + '&clinic='    + encodeURIComponent(CLINIC)
    + '&clinicName='+ encodeURIComponent(CNAME)
    + '&realname='  + encodeURIComponent(rn)
    + '&pid='       + encodeURIComponent(el('pid').value.trim().toUpperCase())
    + '&consent=1';
  get(u).then(function(res){
    if (res.ok){
      el('app').innerHTML = '<div class="msg ok">✅ 綁定完成！<br>'+rn+
        '<br><br>看診當天報到後，系統會自動把看診號碼與候診進度推播給您，可關閉此頁。</div>';
    } else {
      el('tip').innerHTML = '<span class="err">綁定失敗：'+(res.error||'請重試')+'</span>';
      el('go').disabled = false;
    }
  }).catch(function(){
    el('tip').innerHTML = '<span class="err">連線失敗，請稍後再試</span>';
    el('go').disabled = false;
  });
}

function fail(t){ el('app').innerHTML = '<div class="msg err">'+t+'</div>'; }

// ===== 院區選單（無 QR 時）=====
function loadClinics(){
  CLINIC = ''; CNAME = ''; pick = { room:'', doctor:'' };
  el('app').innerHTML = '<div class="msg">載入院區…</div>';
  get(API + '?action=clinics').then(function(res){
    if (res && res.ok) renderClinics(res.clinics);
    else fail((res && res.error) || '讀取院區清單失敗。');
  }).catch(function(){ fail('連線失敗，請重試。'); });
}
function renderClinics(list){
  el('app').innerHTML = '<div class="card"><label>① 選擇您掛號的院區</label><div class="clist" id="clist"></div></div>';
  var box = el('clist');
  (list||[]).forEach(function(c){
    var b = document.createElement('button');
    b.className = 'cbtn';
    // 任何時段都可綁定：休診院區也能選
    b.innerHTML = c.name + (c.active
      ? '<span class="tag">看診中</span>'
      : '<span class="tag" style="color:#aab">休診</span>');
    b.onclick = function(){ CLINIC = c.code; CNAME = c.name; loadRooms(); };
    box.appendChild(b);
  });
}
function loadRooms(){
  render([]);   // 立即顯示表單，不等診間資料（避免卡在載入中）
  get(API + '?action=rooms&clinic=' + encodeURIComponent(CLINIC)).then(function(res){
    if (res && res.ok && res.rooms){ var box = el('info'); if (box) box.innerHTML = infoText(res.rooms); }
  }).catch(function(){});
}

// ===== 啟動 =====
liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()){ liff.login(); return; }
  return liff.getProfile().then(function(p){
    USER.id = p.userId; USER.name = p.displayName || '';
    loadStatus();   // 有進行中的看診 → 顯示候診進度；否則顯示綁定表單
  });
}).catch(function(){ fail('LINE 初始化失敗，請從 LINE 內開啟此頁。'); });
</script>
</body>
</html>
